<!DOCTYPE html>
<html>
<head>
  <title>Fullscreen Iframe</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevents scrollbars */
      height: 100%;
    }
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzX9p_HeNXPYeD9M-XY2eVE5syWDmef_ARDNuEi38agbwNUWWbv0oICpwS0v0ZchIel9A/exec" 
    allowfullscreen>
  </iframe>
</body>
</html>
